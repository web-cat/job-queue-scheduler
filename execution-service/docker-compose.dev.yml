# Local development: Postgres + Adonis with HMR inside Docker.
# Same Node image + lockfile as the Dockerfile `development` stage.
#
# From this directory:
#   docker compose -f docker-compose.dev.yml up --build
#
# App: http://localhost:3333
# DB:  localhost:5432 (same credentials as .env)

services:
  database_service:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - execution_service_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: job_execution_backend_service:dev
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: database_service
      HOST: 0.0.0.0
      # File watching inside Docker (especially on macOS bind mounts)
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      database_service:
        condition: service_healthy
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  execution_service_pgdata_dev:
  app_node_modules:
