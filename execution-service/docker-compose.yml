services:
  job_execution_backend_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: job_execution_backend_service:local
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # When the app runs inside Compose, it must use the DB service DNS name.
      DB_HOST: database_service
      # Adonis must listen on all interfaces inside the container.
      HOST: 0.0.0.0
    depends_on:
      database_service:
        condition: service_healthy

