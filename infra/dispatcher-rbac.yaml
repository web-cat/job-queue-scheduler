apiVersion: v1
kind: ServiceAccount
metadata:
  name: webcat-dispatcher-sa
  namespace: cs4094-22646-s26-web-cat-execution-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webcat-dispatcher-role
  namespace: cs4094-22646-s26-web-cat-execution-service
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webcat-dispatcher-binding
  namespace: cs4094-22646-s26-web-cat-execution-service
subjects:
  - kind: ServiceAccount
    name: webcat-dispatcher-sa
    namespace: cs4094-22646-s26-web-cat-execution-service
roleRef:
  kind: Role
  name: webcat-dispatcher-role
  apiGroup: rbac.authorization.k8s.io
