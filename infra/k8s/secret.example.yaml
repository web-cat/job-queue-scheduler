# Copy to secret.yaml (gitignored) and replace values before deploy:
#   cp infra/k8s/secret.example.yaml infra/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: webcat-secrets
  namespace: webcat
type: Opaque
stringData:
  DB_USER: webcat_admin
  DB_PASSWORD: CHANGE_ME_IN_PRODUCTION
  # 32 chars (same shape as `ace generate:key`). Replace for production.
  APP_KEY: abcdefghijklmnopqrstuvwxyz123456
  POSTGRES_USER: webcat_admin
  POSTGRES_PASSWORD: CHANGE_ME_IN_PRODUCTION
  POSTGRES_DB: webcat
