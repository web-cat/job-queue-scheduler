# Optional: requires a CNI that enforces NetworkPolicy (k3s with default flannel
# may not enforce egress rules — verify on your cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grading-pods-no-egress
  namespace: webcat
spec:
  podSelector:
    matchLabels:
      app: grading-worker
  policyTypes:
    - Egress
  egress: []
