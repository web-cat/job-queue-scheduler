apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcat-dispatcher
  namespace: webcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webcat-dispatcher
  template:
    metadata:
      labels:
        app: webcat-dispatcher
    spec:
      serviceAccountName: webcat-dispatcher-sa
      containers:
        - name: dispatcher
          image: webcat/execution-service:latest
          envFrom:
            - configMapRef:
                name: webcat-config
            - secretRef:
                name: webcat-secrets
          env:
            - name: ENABLE_DISPATCHER
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: 512Mi
          volumeMounts:
            - name: submissions
              mountPath: /data/submissions
      volumes:
        - name: submissions
          persistentVolumeClaim:
            claimName: webcat-submissions-pvc
